name: Build Scrcpy Remote IPA
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Fetch application dependencies
        run: git submodule update --init --recursive --depth 1 scrcpy ios-cmake external/adb-mobile external/libvncserver external/OpenSSL-for-iPhone
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache-dependency-path: porting/libtsnet/go.sum
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install build tools
        run: |
          brew install cmake meson ninja pkg-config nasm fmt googletest sdl3 ffmpeg libusb brotli lz4 zstd pcre2
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --location https://raw.githubusercontent.com/libav/gas-preprocessor/d09971fad329d32df19f5bbafe88cf2f0ed04ed7/gas-preprocessor.pl -o "$RUNNER_TEMP/bin/gas-preprocessor.pl"
          chmod +x "$RUNNER_TEMP/bin/gas-preprocessor.pl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/cache/restore@v4
        id: native
        with:
          path: porting/libs
          key: ios-arm64-xcode26-v3-${{ hashFiles('scripts/ci-build-dependencies.sh', 'porting/scripts/make-libsdl.sh', 'porting/scripts/make-ffmpeg.sh', 'porting/libtsnet/go.*', '.gitmodules') }}
      - name: Build native dependencies
        if: steps.native.outputs.cache-hit != 'true'
        run: bash scripts/ci-build-dependencies.sh 2>&1 | tee build-dependencies.log
      - name: Save native dependencies
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: porting/libs
          key: ${{ steps.native.outputs.cache-primary-key }}
      - name: Build VNC with device OpenSSL
        run: bash scripts/ci-build-vnc.sh 2>&1 | tee build-vnc.log
      - name: Build application and matching Android server
        run: bash scripts/ci-build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ScrcpyRemote-4.6.0-unsigned-IPA
          path: build/ScrcpyRemote-4.6.0-unsigned.ipa
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build-dependencies.log
            build-vnc.log
            build/xcodebuild.log
            build/Archive.xcresult
            scrcpy/server/build/reports/tests
          if-no-files-found: ignore

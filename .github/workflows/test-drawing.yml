name: Drawing Toolkit Tests
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drawing-tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Test drawing settings and protocol
        run: bash scripts/test-drawing-toolkit.sh
      - name: Capture production drawing views in iPad simulator
        run: bash scripts/capture-drawing-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Drawing-Toolkit-UI
          path: build/screenshots
          if-no-files-found: ignore
